name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      - name: Bundle budget (entry JS ≤ 250 kB gzipped)
        run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  db:
    name: Migrations, RLS tests, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local Supabase (Docker) only in CI — developers target the hosted project.
      - name: Start local Supabase and apply migrations + seed
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor --ignore-health-check
      - name: Reset database (migrations + seed from scratch)
        run: npx supabase db reset
      - name: RLS and function tests (pgTAP)
        run: npx supabase test db
      - name: Regenerate types from the local schema and typecheck against them
        run: |
          npm run db:types:local
          npm run typecheck
      - name: Show type drift (informational)
        run: git --no-pager diff --stat -- src/lib/database.types.ts || true
      - if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: Playwright (smoke + coach/parent flows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --with-deps runs apt-get for fonts; when the runner image cannot reach the Ubuntu mirrors
      # (seen 2026-11-11) fall back to the browser alone, which the GitHub image already supports.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      # The coach/parent flows sign up real users, so they run against a local Supabase with the
      # migrations and seed applied (email confirmations are off in supabase/config.toml for local).
      - name: Start local Supabase and apply migrations + seed
        run: |
          npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor --ignore-health-check
          npx supabase db reset
      - name: Point the app at local Supabase
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
